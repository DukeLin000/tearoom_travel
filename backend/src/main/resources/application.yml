spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripmate}
    username: ${DB_USER:tripmate}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
